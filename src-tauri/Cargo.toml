[package]
name = "halo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3.34"
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
thiserror = "2.0.21"
log = "0.4.34"
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libwayshot = "0.9.0"
x11rb = { version = "0.14.0", features = ["randr"] }

[target."cfg(windows)".dependencies]
xcap = "0.9"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
